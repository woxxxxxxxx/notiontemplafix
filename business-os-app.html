*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
a{color:inherit;text-decoration:none} button{cursor:pointer;font-family:'Inter',sans-serif}

.okr-obj{font-size:15px;font-weight:800;margin-bottom:4px}

.dash-section{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:14px}
.dash-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);margin-bottom:12px}

.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}

.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}

function load(){

  projects=JSON.parse(LS.getItem(PRK)||'null')||JSON.parse(JSON.stringify(SEED_PR));
  tasks=JSON.parse(LS.getItem(TSK)||'null')||JSON.parse(JSON.stringify(SEED_TS));

  [[CLK,clients],[PRK,projects],[TSK,tasks],[INK,invoices],[OKK,okrs]].forEach(function(p){
    if(!LS.getItem(p[0]))LS.setItem(p[0],JSON.stringify(p[1]));

function saveAll(){
  LS.setItem(CLK,JSON.stringify(clients));LS.setItem(PRK,JSON.stringify(projects));
  LS.setItem(TSK,JSON.stringify(tasks));LS.setItem(INK,JSON.stringify(invoices));
  LS.setItem(OKK,JSON.stringify(okrs));

function uid(){return 'x'+Math.random().toString(36).slice(2,9);}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt$(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmtD(ds){if(!ds)return '';return new Date(ds+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function daysTo(ds){if(!ds)return null;return Math.round((new Date(ds+'T00:00:00')-new Date(TODAY+'T00:00:00'))/86400000);}
function getClient(id){return clients.find(function(c){return c.id===id;})||{company:'Unknown',contact:''};}
function getProject(id){return projects.find(function(p){return p.id===id;})||{name:'Unknown'};}
function statusBadge(s){var m={'Active':'b-active','Lead':'b-lead','Inactive':'b-inactive','Todo':'b-todo','In Progress':'b-prog','Done':'b-done','On Hold':'b-onhold','Completed':'b-completed','Paid':'b-paid','Pending':'b-pending','Overdue':'b-overdue'};return '<span class="badge '+(m[s]||'b-todo')+'">'+s+'</span>';}
function priBadge(p){return '<span class="badge '+(p==='High'?'b-hi':p==='Medium'?'b-med':'b-lo')+'">'+p+'</span>';}

function sv(v){
  curView=v;
  ['dashboard','clients','projects','tasks','finance','okrs'].forEach(function(n){
    document.getElementById('view-'+n).style.display=n===v?'':'none';
    var t=document.querySelector('.tab[data-view="'+n+'"]');
    if(t)t.classList.toggle('active',n===v);
  });
  render();
}
function render(){
  if(curView==='dashboard')renderDash();
  else if(curView==='clients')renderClients();
  else if(curView==='projects')renderProjects();
  else if(curView==='tasks')renderTasks();
  else if(curView==='finance')renderFinance();
  else renderOKRs();
}

  var h='<div class="stat-grid">';
  h+=sc('Active Clients',activeClients,'Current clients','');

  h+='<div class="dash-section"><div class="dash-section-title">📁 Active Projects</div>';

    h+='<div style="font-size:16px;font-weight:800;color:var(--acc2)">'+p.progress+'%</div></div>';
  });
  h+='</div>';

  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">';
  h+='<div class="dash-section"><div class="dash-section-title">🔴 High Priority Tasks</div>';
  var hp=tasks.filter(function(t){return t.priority==='High'&&t.status!=='Done';}).slice(0,4);
  if(!hp.length)h+='<div style="color:var(--txt2);font-size:13px">None outstanding.</div>';

    h+='<div style="padding:6px 0;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px">';
    h+='<div style="flex:1;font-size:13px;font-weight:500">'+esc(t.title)+'</div>';
    h+=statusBadge(t.status)+'</div>';
  });
  h+='</div>';

  h+='<div class="dash-section"><div class="dash-section-title">💳 Recent Payments</div>';
  var rp=invoices.filter(function(i){return i.amount>0;}).sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,4);
  if(!rp.length)h+='<div style="color:var(--txt2);font-size:13px">No payments yet.</div>';
  else rp.forEach(function(i){
    var cl=getClient(i.clientId);
    h+='<div style="padding:6px 0;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between">';
    h+='<div><div style="font-size:12px;font-weight:600">'+esc(cl.company)+'</div>';
    h+='<div style="font-size:11px;color:var(--txt2)">'+fmtD(i.date)+'</div></div>';

    h+=statusBadge(i.status)+'</div></div>';

function renderTasks(){
  var statuses=['Todo','In Progress','Done'];
  var h='<div class="sh"><div class="st">Task Board</div><button class="btn-p" onclick="openTM(null)">+ Add Task</button></div>';
  h+='<div class="kanban">';
  statuses.forEach(function(status){
    var items=tasks.filter(function(t){return t.status===status;});
    var colColor={'Todo':'var(--txt2)','In Progress':'var(--acc2)','Done':'var(--grn)'}[status];
    h+='<div class="kb-col"><div class="kb-hdr" style="color:'+colColor+'">'+status+'<span style="color:var(--txt2);font-weight:400">'+items.length+'</span></div>';
    h+='<div class="kb-cnt">';
    if(!items.length)h+='<div style="font-size:12px;color:var(--txt2);text-align:center;padding:16px 0">Empty</div>';
    else items.forEach(function(t){
      var pr=getProject(t.projectId);
      h+='<div class="kb-card"><div class="kb-title">'+esc(t.title)+'</div>';
      h+='<div class="kb-meta">'+priBadge(t.priority);
      h+='<span class="kb-proj">'+esc(pr.name)+'</span></div>';
      if(t.due)h+='<div class="kb-due">📅 '+fmtD(t.due)+'</div>';
      h+='<div class="kb-actions">';
      var si=statuses.indexOf(status);
      if(si>0)h+='<button class="status-btn" onclick="moveTask(\''+t.id+'\',-1)">←</button>';

      h+='<button class="bico" onclick="openTM(\''+t.id+'\')">✏️</button>';
      h+='<button class="bico del" onclick="delTask(\''+t.id+'\')">🗑️</button>';
      h+='</div></div>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  document.getElementById('view-tasks').innerHTML=h;
}
function moveTask(id,dir){
  var statuses=['Todo','In Progress','Done'];
  var t=tasks.find(function(x){return x.id===id;});if(!t)return;

  if(idx>=0&&idx<3){t.status=statuses[idx];saveAll();renderTasks();}
}

      h+='<div style="width:14px;height:14px;border-radius:50%;background:'+(kr.progress>=100?'var(--grn)':'var(--bdr)');h+=';border:2px solid '+(kr.progress>=100?'var(--grn)':'var(--acc)');h+=';flex-shrink:0"></div>';
      h+='<div class="kr-text">'+esc(kr.text)+'</div>';
      h+='<input class="kr-input" type="number" min="0" max="100" value="'+kr.progress+'" onchange="updateKR(\''+o.id+'\',\''+kr.id+'\',this.value)">';
      h+='<div class="kr-pct">'+kr.progress+'%</div>';
      h+='</div>';
    });
    h+='<div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="bico del" onclick="delOKR(\''+o.id+'\')">🗑️ Delete OKR</button></div>';
    h+='</div>';
  });
  document.getElementById('view-okrs').innerHTML=h;
}
function updateKR(oid,krid,val){
  var o=okrs.find(function(x){return x.id===oid;});if(!o)return;
  var kr=o.keyResults.find(function(x){return x.id===krid;});
  if(kr){kr.progress=Math.min(100,Math.max(0,parseInt(val)||0));saveAll();}
  var el=document.querySelector('.okr-card .kr-pct');
  renderOKRs();
}
function saveOKR(){
  var obj=document.getElementById('okrm-obj').value.trim();if(!obj)return;
  var krs=[];
  ['okrm-kr1','okrm-kr2','okrm-kr3'].forEach(function(id){
    var v=document.getElementById(id).value.trim();
    if(v)if(!ntfAddCheck())return;
    krs.push({id:uid(),text:v,progress:0});
  });
  if(!ntfAddCheck())return;
  okrs.push({id:uid(),objective:obj,quarter:document.getElementById('okrm-quarter').value,keyResults:krs});
  saveAll();cm2('okr-modal');render();
}
function delOKR(id){if(!confirm('Delete OKR?'))return;okrs=okrs.filter(function(o){return o.id!==id;});saveAll();render();}

function cm2(id){document.getElementById(id).classList.add('hidden');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.modal-ov').forEach(function(el){el.classList.add('hidden');});});
document.querySelectorAll('.modal-ov').forEach(function(ov){ov.addEventListener('click',function(e){if(e.target===ov)ov.classList.add('hidden');});});

load(); renderDash();

(function(){
  var unkey='lib_unlocked_business-os';
  var unlocked=localStorage.getItem(unkey);
  var demo=DEMO;
  var demoBtn=document.getElementById('ntf-try-demo');
  if(unlocked){
    document.getElementById('ntf-lock').style.display='none';
    if(demoBtn)demoBtn.style.display='none';
    return;
  }
  if(demo){
    document.getElementById('ntf-lock').style.display='none';
    var b=document.getElementById('ntf-banner');
    b.style.display='flex';
    document.body.style.paddingTop='44px';
    return;
  }
  document.getElementById('ntf-lock').style.display='flex';
  if(demoBtn){
    demoBtn.addEventListener('click',function(){
      sessionStorage.setItem('ntf_demo','1');
      window.location.reload();
    });
  }
})();

</script>
